name: 09:00 Carousel Yayını

on:
  schedule:
    # Her gün 09:00 Berlin saati
    # Yaz/kış saati otomatik olarak Europe/Berlin tarafından yönetilir
    - cron: "15 9 * * *"
      timezone: "Europe/Berlin"

  # Manuel çalıştırma
  workflow_dispatch:

permissions:
  contents: write

jobs:
  carousel:
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------
      # 1. Depoyu indir
      # ----------------------------------------
      - name: Depoyu indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----------------------------------------
      # 2. Python kurulumu
      # ----------------------------------------
      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ----------------------------------------
      # 3. Bağımlılıkları yükle
      # ----------------------------------------
      - name: Bağımlılıkları yükle
        run: |
          python -m pip install --upgrade pip
          pip install playwright anthropic python-dotenv requests
          playwright install --with-deps chromium

      # ----------------------------------------
      # 4. Git ayarları
      # ----------------------------------------
      - name: Git ayarları
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"

      # ----------------------------------------
      # 5. İçerik üret
      # ----------------------------------------
      - name: İçerik üret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python icerik_uret.py

      # ----------------------------------------
      # 6. Görsel üret
      # ----------------------------------------
      - name: Görsel üret
        run: |
          python gorsel_uret.py

      # ----------------------------------------
      # 7. Oluşturulan dosyaları GitHub'a kaydet
      # ----------------------------------------
      - name: Oluşturulan dosyaları GitHub'a kaydet
        run: |
          git add -A

          if git diff --cached --quiet; then
            echo "Kaydedilecek değişiklik yok."
          else
            git commit -m "carousel: $(date -u +%Y-%m-%d-%H-%M-%S)"
            git push
          fi

      # ----------------------------------------
      # 8. Görsellerin erişilebilir olmasını bekle
      # ----------------------------------------
      - name: Görsellerin erişilebilir olmasını bekle
        run: |
          sleep 30

      # ----------------------------------------
      # 9. Instagram Carousel yayınla
      # ----------------------------------------
      - name: Carousel yayınla
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}

          GITHUB_USERNAME: gonatureverse-collab
          GITHUB_REPO: instagram-otomasyon-deutsch
          GITHUB_BRANCH: main

        run: |
          python carousel_yayinla.py

name: 08:00 UTC Carousel Yayını

on:
  schedule:
    # Her gün 08:00 UTC
    - cron: "0 2 * * *"

  # Manuel çalıştırma
  workflow_dispatch:

permissions:
  contents: write

jobs:
  carousel:
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------
      # 1. Depoyu indir
      # ----------------------------------------
      - name: Depoyu indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----------------------------------------
      # 2. UTC saatini kontrol et
      # ----------------------------------------
      - name: UTC saatini kontrol et
        run: |
          echo "=== GitHub UTC Saati ==="
          date -u '+%Y-%m-%d %H:%M:%S UTC'
          echo ""
          echo "Almanya saati:"
          TZ=Europe/Berlin date '+%Y-%m-%d %H:%M:%S %Z'
          echo ""
          echo "Workflow tetikleyicisi:"
          echo "${{ github.event_name }}"

      # ----------------------------------------
      # 3. Python kurulumu
      # ----------------------------------------
      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ----------------------------------------
      # 4. Bağımlılıkları yükle
      # ----------------------------------------
      - name: Bağımlılıkları yükle
        run: |
          python -m pip install --upgrade pip
          pip install playwright anthropic python-dotenv requests
          playwright install --with-deps chromium

      # ----------------------------------------
      # 5. Git ayarları
      # ----------------------------------------
      - name: Git ayarları
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"

      # ----------------------------------------
      # 6. İçerik üret
      # ----------------------------------------
      - name: İçerik üret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python icerik_uret.py

      # ----------------------------------------
      # 7. Görsel üret
      # ----------------------------------------
      - name: Görsel üret
        run: |
          python gorsel_uret.py

      # ----------------------------------------
      # 8. Oluşturulan dosyaları GitHub'a kaydet
      # ----------------------------------------
      - name: Oluşturulan dosyaları GitHub'a kaydet
        run: |
          git add -A

          if git diff --cached --quiet; then
            echo "Kaydedilecek değişiklik yok."
          else
            git commit -m "carousel: $(date -u +%Y-%m-%d-%H-%M-%S)"
            git push
          fi

      # ----------------------------------------
      # 9. Görsellerin erişilebilir olmasını bekle
      # ----------------------------------------
      - name: Görsellerin erişilebilir olmasını bekle
        run: |
          sleep 30

      # ----------------------------------------
      # 10. Instagram Carousel yayınla
      # ----------------------------------------
      - name: Carousel yayınla
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}

          GITHUB_USERNAME: gonatureverse-collab
          GITHUB_REPO: instagram-otomasyon-deutsch
          GITHUB_BRANCH: main

        run: |
          python carousel_yayinla.py

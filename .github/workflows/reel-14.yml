name: 14:00 Reel Yayını

on:
  schedule:
    - cron: "0 14 * * *"
      timezone: "Europe/Berlin"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install playwright anthropic python-dotenv requests moviepy
          playwright install --with-deps chromium
      - run: git config --global user.email "action@github.com" && git config --global user.name "GitHub Action"
      
      - name: Reel üret ve yayınla
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          GITHUB_USERNAME: gonatureverse-collab
          GITHUB_REPO: instagram-otomasyon
        run: python reel_uret.py
      
      - name: Değişiklikleri kaydet
        run: |
          git add kullanilan_konular.json cikti/ gorseller/ reels/
          git diff --cached --quiet || git commit -m "reel: $(date +%Y-%m-%d-%H-%M)"
          git push
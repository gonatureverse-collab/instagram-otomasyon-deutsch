name: 10:30 UTC Reel Yayını

on:
  schedule:
    # Her gün 10:30 UTC
    # Almanya: kışın 11:30, yazın 12:30
    - cron: "30 10 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  reel:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Saatleri göster
        shell: bash
        run: |
          echo "=== GitHub UTC Saati ==="
          date -u '+%Y-%m-%d %H:%M:%S UTC'

          echo "=== Almanya Saati ==="
          TZ=Europe/Berlin date '+%Y-%m-%d %H:%M:%S %Z'

          echo "=== Workflow Tetikleyicisi ==="
          echo "${{ github.event_name }}"

      - name: Python kurulumu
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Sistem ve Python bağımlılıklarını yükle
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

          python -m pip install --upgrade pip
          pip install requests python-dotenv azure-cognitiveservices-speech

      - name: Git ayarları
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"

      - name: Reel oluştur ve yayınla
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}

          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}

          GITHUB_USERNAME: gonatureverse-collab
          GITHUB_REPO: instagram-otomasyon-deutsch
          GITHUB_BRANCH: main
        run: |
          python -u reel_uret.py

      - name: Oluşturulan dosyaları kaydet
        shell: bash
        run: |
          git add kullanilan_konular.json cikti/ gorseller/ reels/

          if git diff --cached --quiet; then
            echo "Kaydedilecek değişiklik yok."
          else
            git commit -m "reel: $(date -u +%Y-%m-%d-%H-%M-%S)"
            git push origin main
          fi

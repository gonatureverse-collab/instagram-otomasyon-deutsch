name: 20:00 Story Yayını

on:
  schedule:
    - cron: "0 20 * * *"
      timezone: "Europe/Berlin"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  story:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları yükle
        run: |
          python -m pip install --upgrade pip
          pip install playwright anthropic python-dotenv requests pillow
          playwright install --with-deps chromium

      - name: Git ayarları
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"

      - name: Story görselini üret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_USERNAME: gonatureverse-collab
          GITHUB_REPO: instagram-otomasyon-deutsch
          GITHUB_BRANCH: main
        run: |
          python story_uret.py

      - name: Story dosyalarını GitHub'a kaydet
        run: |
          git add kullanilan_konular.json cikti/ stories/
          git diff --cached --quiet || git commit -m "story: $(date +%Y-%m-%d-%H-%M-%S)"
          git push

      - name: GitHub CDN güncellemesini bekle
        run: |
          sleep 15

      - name: Story yayınla
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          GITHUB_USERNAME: gonatureverse-collab
          GITHUB_REPO: instagram-otomasyon-deutsch
          GITHUB_BRANCH: main
        run: |
          python story_yayinla.py

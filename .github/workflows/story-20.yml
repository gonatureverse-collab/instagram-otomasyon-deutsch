name: 19:00 UTC Story Yayını

on:
  schedule:
    # Her gün 19:00 UTC
    # Almanya: kışın 19:00, yazın 20:00
    - cron: "0 13 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  story:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: UTC saatini göster
        run: |
          echo "=== GitHub UTC Saati ==="
          date -u '+%Y-%m-%d %H:%M:%S UTC'
          echo "Workflow tetikleyicisi: ${{ github.event_name }}"

      - name: Python kurulumu
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Bağımlılıkları yükle
        run: |
          python -m pip install --upgrade pip
          pip install playwright anthropic python-dotenv requests pillow
          playwright install --with-deps chromium

      - name: Git ayarları
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"

      - name: Story görselini üret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_USERNAME: gonatureverse-collab
          GITHUB_REPO: instagram-otomasyon-deutsch
          GITHUB_BRANCH: main
        run: |
          python story_uret.py

      - name: Story dosyalarını GitHub'a kaydet
        run: |
          git add kullanilan_konular.json cikti/ stories/

          if git diff --cached --quiet; then
            echo "Kaydedilecek değişiklik yok."
          else
            git commit -m "story: $(date -u +%Y-%m-%d-%H-%M-%S)"
            git push origin main
          fi

      - name: GitHub CDN güncellemesini bekle
        run: |
          sleep 60

      - name: Story yayınla
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          GITHUB_USERNAME: gonatureverse-collab
          GITHUB_REPO: instagram-otomasyon-deutsch
          GITHUB_BRANCH: main
        run: |
          python story_yayinla.py
